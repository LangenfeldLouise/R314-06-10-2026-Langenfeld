name: Deploy Clients

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on Ubuntu server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            export PATH="$HOME/.bun/bin:$PATH"

            cd /var/www/clients/R314-06-10-2026-Langenfeld

            git pull origin main
            bun install --frozen-lockfile
            bun run --bun build

            sudo systemctl restart clients
            sudo systemctl status clients --no-pager

            curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:3344/